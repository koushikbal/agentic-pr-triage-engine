name: Agentic PR Triage
on:
  workflow_run:
    workflows: [Test]
    types: [completed]
jobs:
  triage:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions: {contents: write, pull-requests: write, actions: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python -m src.main --repo "${{ github.repository }}" --pr "${{ github.event.workflow_run.pull_requests[0].number }}" --run-id "${{ github.event.workflow_run.id }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
