[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-pr-triage-engine"
version = "1.0.0"
description = "Production-oriented agentic CI failure triage and auto-fix engine."
requires-python = ">=3.11"
dependencies = ["langgraph>=0.2.0", "pydantic>=2.7", "PyGithub>=2.3", "requests>=2.32", "openai>=1.40"]

[project.scripts]
agentic-triage = "src.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

